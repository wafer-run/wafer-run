[package]
name = "multi-flow"
version = "0.0.1"
edition = "2021"

[dependencies]
wafer-run  = { path = "../../crates/wafer-run", features = ["full"] }
wafer-flow-http-server = { path = "../../crates/wafer-flow-http-server" }
wafer-block-inspector = { path = "../../crates/wafer-block-inspector" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
