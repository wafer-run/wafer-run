[workspace]

[package]
name = "wafer-example-network-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Example WASM block that fetches a URL via the network block and returns processed results"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53"
wafer-core = { path = "../../crates/wafer-core", features = ["wasm-component"] }
wafer-block = { path = "../../crates/wafer-block" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
