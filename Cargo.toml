[workspace]
resolver = "2"
members = [
    "crates/wafer-block",
    "crates/wafer-block-macro",
    "crates/wafer-block-config",
    "crates/wafer-block-cors",
    "crates/wafer-block-crypto",
    "crates/wafer-block-fastembed",
    "crates/wafer-block-http-listener",
    "crates/wafer-block-iam-guard",
    "crates/wafer-block-inspector",
    "crates/wafer-block-ip-rate-limit",
    "crates/wafer-block-local-storage",
    "crates/wafer-block-logger",
    "crates/wafer-block-monitoring",
    "crates/wafer-block-network",
    "crates/wafer-block-postgres",
    "crates/wafer-block-readonly-guard",
    "crates/wafer-block-router",
    "crates/wafer-block-s3",
    "crates/wafer-block-security-headers",
    "crates/wafer-block-sqlite",
    "crates/wafer-sql-utils",
    "crates/wafer-test-support",
    "crates/wafer-block-web",
    "crates/wafer-flow-http-server",
    "crates/wafer-flow",
    "crates/wafer-run",
    "crates/wafer-core",
    "crates/wafer-ffi",
    "crates/wafer-run-node",
    "sdks/rust",
    "crates/wafer-site",
    "examples/hello-world",
    "examples/static-site",
    "examples/api-server",
    "examples/multi-flow",
    "examples/middleware-chain",
    "crates/wafer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
wafer-block = { path = "crates/wafer-block" }
wafer-run = { path = "crates/wafer-run", features = ["full"] }
wafer-core = { path = "crates/wafer-core" }
wafer-sql-utils = { path = "crates/wafer-sql-utils" }
wafer-flow = { path = "crates/wafer-flow" }

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
tokio-stream = "0.1"
bytes = "1"

# HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
hyper = "1"

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# WASM
wasmi = "0.44"

# Crypto
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
base64ct = { version = "1", features = ["alloc"] }

# Storage
aws-sdk-s3 = "1"
aws-config = "1"

# Network
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Config
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }

# Node.js bindings
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"

# Dev
tempfile = "3"

[workspace.lints.clippy]
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
uninlined_format_args = "warn"
cloned_instead_of_copied = "warn"
manual_let_else = "warn"

[workspace.lints.rust]
unused_must_use = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
