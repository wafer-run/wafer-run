# Standalone crate: this is its own workspace so it is NOT picked up by the
# parent `wafer-run` workspace at `crates/wafer-block-macro/tests/...`.
# The accompanying `#[test]` in `wafer-block-macro/tests/skill_block_without_wafer_run_dep.rs`
# shells out to `cargo build --target wasm32-wasip1 --release` against this crate
# to verify that `#[wafer_block]` expands successfully on wasm32 even when the
# consumer crate has no `wafer-run` dep in its graph (regression for the
# `::wafer_block::register_static_block!` path-resolution bug).
[workspace]

[package]
name = "skill-block-without-wafer-run-dep"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Intentionally only `wafer-sdk` + `wafer-block`. NO `wafer-run` dependency.
# This mirrors what real skill-block consumers (e.g. gizza-ai/clock) declare.
[dependencies]
wafer-sdk = { path = "../../../../sdks/rust" }
wafer-block = { path = "../../../wafer-block" }
serde_json = "1"
