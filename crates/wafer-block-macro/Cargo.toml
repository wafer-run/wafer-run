[package]
name = "wafer-block-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc macros for WAFER block authoring"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# Used at macro-expansion time to validate author-supplied `skill(parameters = "...")`
# JSON, so malformed schemas fail the build at the macro site rather than panicking
# the first time the generated `block_info()` runs.
serde_json = { workspace = true }

[dev-dependencies]
wafer-block = { path = "../wafer-block" }
wafer-sdk = { path = "../../sdks/rust" }
wafer-run = { path = "../wafer-run" }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt", "macros"] }
trybuild = "1"

[lints]
workspace = true
