[package]
name = "wafer-block-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc macros for WAFER block authoring"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
wafer-block = { path = "../wafer-block" }
wafer-sdk = { path = "../../sdks/rust" }
wafer-run = { path = "../wafer-run" }
async-trait = "0.1"
serde_json = { workspace = true }
trybuild = "1"

[lints]
workspace = true
