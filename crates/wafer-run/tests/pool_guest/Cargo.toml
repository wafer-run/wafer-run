[workspace]

[package]
name = "pool-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Variant build for the cold-control tests: declares
# InstanceMode::PerExecution instead of Singleton, so the warm instance
# pool must NOT engage. scripts/build-fixtures.sh builds both variants
# (pool_guest_singleton.wasm / pool_guest_percall.wasm) from this one crate.
percall = []
# Variant build for the per-flow tests: declares InstanceMode::PerFlow, so
# the warm pool keeps one instance set per flow (pool_guest_perflow.wasm).
perflow = []

[dependencies]
wafer-sdk = { path = "../../../../sdks/rust" }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
