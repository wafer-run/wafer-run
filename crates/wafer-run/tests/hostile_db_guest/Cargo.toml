[workspace]

[package]
name = "hostile-db-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Deliberately the PUBLIC guest SDK only — NOT wafer-core. wafer-core's own
# `clients::*` (used by native/wasm-component blocks) stamp WRAP meta via
# `apply_wrap_meta`; `wafer-sdk`'s `clients::database` does not — it is a
# thin streaming-ABI wrapper with no knowledge of WRAP at all. That gap is
# exactly the SP-A "meta-omission" vector: any ordinary guest built against
# the public SDK (third-party skill blocks, not just a hand-crafted
# attacker) sends these requests with no WRAP meta whatsoever. This fixture
# does not need to "bypass" anything to be hostile — it just needs to be an
# unprivileged, ordinary SDK guest.
wafer-sdk = { path = "../../../../sdks/rust" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
