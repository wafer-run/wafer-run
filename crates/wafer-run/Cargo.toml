[package]
name = "wafer-run"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WAFER runtime — WebAssembly Architecture for Flow Execution & Routing"
repository = "https://github.com/wafer-run/wafer-run"

[features]
default = ["wasm"]
wasmi = ["dep:wasmi", "dep:getrandom"]
# `wasm` keeps the historical bundle of "needs full async runtime + remote
# block fetching": wasmi interpreter, reqwest for downloads, and tokio's
# rt + rt-multi-thread for native-side hosting. tokio::sync::Mutex (used by
# BlockSlot) is always-on via the base `tokio` dep below.
wasm = ["wasmi", "dep:reqwest", "tokio/rt", "tokio/rt-multi-thread"]
full = ["wasm", "dep:tracing-subscriber"]
# Throwaway feature flag that gates a streaming-ABI spike test (see
# tests/streaming_spike.rs). Registers an extra `wafer_spike` host import
# module used only by the spike guest. NOT for production builds — the
# real streaming ABI lives behind `__wafer_host_stream_*` and is the
# subject of a separate task.
spike = []

[dependencies]
# Shared block types
wafer-block = { workspace = true }
wafer-flow = { workspace = true }
wafer-schema = { workspace = true }

# Core
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
dirs = "5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
futures = { workspace = true }
# Always-on: BlockSlot uses tokio::sync::Mutex, which works on every target
# (wasm32 included) since `sync` doesn't need the tokio runtime. Heavier
# features (rt, rt-multi-thread) come in via the `wasm` feature for native
# hosts that actually run a tokio runtime.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
bytes = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

# WASM (wasmi interpreter engine)
wasmi = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }

# `web-time` polyfills `SystemTime` / `Instant` on wasm32 (via Date.now /
# Performance.now) and is a zero-cost re-export of `std::time` on native.
# Needed everywhere because the wasmi host imports (clock_time_get) run in
# both native and wasm-compiled runtimes (solobase-web embeds wasmi too).
web-time = "1"

# Network (reqwest for WASM remote block downloads)
reqwest = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tempfile = { workspace = true }
tracing-test = "0.2"
wat = "1"
wafer-sdk = { path = "../../sdks/rust" }
wafer-test-support = { path = "../wafer-test-support" }
wafer-block-readonly-guard = { path = "../wafer-block-readonly-guard" }
wafer-block-ip-rate-limit = { path = "../wafer-block-ip-rate-limit" }
wafer-block-monitoring = { path = "../wafer-block-monitoring" }
wafer-block-cors = { path = "../wafer-block-cors" }
wafer-block-postgres = { path = "../wafer-block-postgres" }
wafer-block-s3 = { path = "../wafer-block-s3" }
wafer-block-router = { path = "../wafer-block-router" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serial_test = "3"
