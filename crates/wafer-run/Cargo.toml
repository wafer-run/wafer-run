[package]
name = "wafer-run"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WAFER runtime — WebAssembly Architecture for Flow Execution & Routing"
repository = "https://github.com/wafer-run/wafer-run"

[features]
default = ["wasm"]
wasmi = ["dep:wasmi", "dep:getrandom"]
wasm = ["wasmi", "dep:reqwest", "dep:tokio"]
full = ["wasm", "dep:tracing-subscriber"]

[dependencies]
# Shared block types
wafer-block = { workspace = true }
wafer-flow = { workspace = true }

# Core
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, optional = true }
bytes = { workspace = true }
sha2 = { workspace = true }
url = "2"

# WASM (wasmi interpreter engine)
wasmi = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
web-time = "1"

# Network (reqwest for WASM remote block downloads)
reqwest = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
wat = "1"
