[package]
name = "wafer-run"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WAFER runtime — WebAssembly Architecture for Flow Execution & Routing"
repository = "https://github.com/wafer-run/wafer-run"

[features]
default = ["wasm"]
wasmi = ["dep:wasmi", "dep:getrandom"]
# `wasm` bundles "needs full async runtime + seal-time download of
# lockfile-pinned blocks": wasmi interpreter, reqwest + flate2 + tar for the
# download, and tokio's rt + rt-multi-thread for native-side hosting.
# tokio::sync::Mutex (used by BlockSlot) is always-on via the base `tokio`
# dep below.
wasm = ["wasmi", "dep:reqwest", "dep:wafer-net-security", "dep:url", "dep:flate2", "dep:tar", "tokio/rt", "tokio/rt-multi-thread"]
full = ["wasm", "dep:tracing-subscriber"]
# SSRF escape hatch for registry downloads (SEC-09): permits registries on
# private/loopback/link-local addresses. Compile-time only
# (SEC-018 precedent) — intended for local development and integration
# tests, never production builds.
allow-private-network = ["wafer-net-security?/allow-private-network"]

[dependencies]
# Shared block types
wafer-block = { workspace = true }
wafer-flow = { workspace = true }
wafer-schema = { workspace = true }

# Core
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
dirs = "6"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
futures = { workspace = true }
# Always-on: BlockSlot uses tokio::sync::Mutex, which works on every target
# (wasm32 included) since `sync` doesn't need the tokio runtime. Heavier
# features (rt, rt-multi-thread) come in via the `wasm` feature for native
# hosts that actually run a tokio runtime.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
# Used by `embed::output_to_json` for the base64 wire encoding of binary
# respond/halt bodies, shared by the wafer-ffi and wafer-run-node bindings.
base64ct = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
rmp-serde = "1.3"

# WASM (wasmi interpreter engine)
wasmi = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }

# `web-time` polyfills `SystemTime` / `Instant` on wasm32 (via Date.now /
# Performance.now) and is a zero-cost re-export of `std::time` on native.
# Needed everywhere because the wasmi host imports (clock_time_get) run in
# both native and wasm-compiled runtimes (the browser build embeds wasmi too).
web-time = "1"

# Network: seal() downloads a lockfile-pinned package whose cache is missing
# (reqwest), with SSRF filtering (SEC-09), composes its download URL from the
# lockfile's registry source (url), and unpacks the `.wasm` from the gzipped
# tarball in memory (flate2 + tar).
reqwest = { workspace = true, optional = true }
wafer-net-security = { workspace = true, optional = true }
url = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

# The init budget's timer (`platform::sleep`): futures-timer's own timer
# thread on native hosts, so it needs no particular executor (no tokio time
# driver), and the host's global `setTimeout` on wasm32 (browser, Cloudflare
# Workers).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true

[dev-dependencies]
# Benchmarks only (never a regular dependency; dev-deps are not built for
# wasm32 lib targets, so this stays out of the wasm32 build).
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tempfile = { workspace = true }
tracing-test = "0.2"
wat = "1"
# Local registry for the seal-time download e2es (tests/registry_ssrf.rs,
# tests/remote_integrity.rs).
wiremock = "0.6"
wafer-sdk = { path = "../../sdks/rust" }
wafer-test-support = { path = "../wafer-test-support" }
wafer-block-readonly-guard = { path = "../wafer-block-readonly-guard" }
wafer-block-ip-rate-limit = { path = "../wafer-block-ip-rate-limit" }
wafer-block-monitoring = { path = "../wafer-block-monitoring" }
wafer-block-cors = { path = "../wafer-block-cors" }
# Flow short-circuit header carry (tests/flow_error_keeps_middleware_headers.rs).
wafer-block-security-headers = { path = "../wafer-block-security-headers" }
wafer-block-postgres = { path = "../wafer-block-postgres" }
wafer-block-s3 = { path = "../wafer-block-s3" }
wafer-block-router = { path = "../wafer-block-router" }
# Every statically registered block crate, linked so
# tests/empty_config_source_boots.rs sees their declared config.
wafer-block-web = { path = "../wafer-block-web" }
wafer-block-inspector = { path = "../wafer-block-inspector" }
wafer-block-http-listener = { path = "../wafer-block-http-listener" }
# Task 8 hostile-guest e2e (SP-A Stage 1): needs the REAL wafer-core
# database handler (decode_and_authorize / check_resource_access) wired to
# a REAL backend, not a hand-rolled fake — same shape as the
# wafer-block-postgres/s3 dev-deps above (no cycle: wafer-core does not
# depend on wafer-run).
wafer-core = { workspace = true }
wafer-block-sqlite = { path = "../wafer-block-sqlite" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serial_test = "3"
# The llm service trait's signatures name `CancellationToken`
# (tests/model_services_caller_e2e.rs implements it).
tokio-util = { workspace = true }

# Criterion benchmark suite (PERF-01..03 measurement prerequisite, 2026-07-14
# deep-dive review). Fixture guests are built by scripts/build-fixtures.sh.
[[bench]]
name = "wasm_guest"
harness = false
required-features = ["wasm"]

[[bench]]
name = "flow_dispatch"
harness = false
