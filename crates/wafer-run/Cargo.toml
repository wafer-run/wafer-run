[package]
name = "wafer-run"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WAFER runtime — WebAssembly Architecture for Flow Execution & Routing"
repository = "https://github.com/wafer-run/wafer-run"

[features]
default = ["wasm"]
wasmi = ["dep:wasmi", "dep:getrandom"]
# `wasm` keeps the historical bundle of "needs full async runtime + remote
# block fetching": wasmi interpreter, reqwest for downloads, and tokio's
# rt + rt-multi-thread for native-side hosting. tokio::sync::Mutex (used by
# BlockSlot) is always-on via the base `tokio` dep below.
wasm = ["wasmi", "dep:reqwest", "dep:wafer-net-security", "dep:url", "tokio/rt", "tokio/rt-multi-thread"]
full = ["wasm", "dep:tracing-subscriber"]
# SSRF escape hatch for registry downloads (SEC-09): permits registries and
# artifact URLs on private/loopback/link-local addresses. Compile-time only
# (SEC-018 precedent) — intended for local development and integration
# tests, never production builds.
allow-private-network = ["wafer-net-security?/allow-private-network"]

[dependencies]
# Shared block types
wafer-block = { workspace = true }
wafer-flow = { workspace = true }
wafer-schema = { workspace = true }

# Core
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
dirs = "6"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
futures = { workspace = true }
# Always-on: BlockSlot uses tokio::sync::Mutex, which works on every target
# (wasm32 included) since `sync` doesn't need the tokio runtime. Heavier
# features (rt, rt-multi-thread) come in via the `wasm` feature for native
# hosts that actually run a tokio runtime.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
# Used by `embed::output_to_json` for the base64 wire encoding of binary
# respond/halt bodies, shared by the wafer-ffi and wafer-run-node bindings.
base64ct = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

# WASM (wasmi interpreter engine)
wasmi = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }

# `web-time` polyfills `SystemTime` / `Instant` on wasm32 (via Date.now /
# Performance.now) and is a zero-cost re-export of `std::time` on native.
# Needed everywhere because the wasmi host imports (clock_time_get) run in
# both native and wasm-compiled runtimes (the browser build embeds wasmi too).
web-time = "1"

# Network (reqwest for WASM remote block downloads)
reqwest = { workspace = true, optional = true }
# SSRF filtering for registry/manifest downloads (SEC-09); url validates the
# WAFER_RUN_REGISTRY_BASE_URL override at seal time.
wafer-net-security = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# Benchmarks only (never a regular dependency; dev-deps are not built for
# wasm32 lib targets, so this stays out of the wasm32 build).
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tempfile = { workspace = true }
tracing-test = "0.2"
wat = "1"
# SEC-09 registry-download SSRF e2e (tests/registry_ssrf.rs).
wiremock = "0.6"
wafer-sdk = { path = "../../sdks/rust" }
wafer-test-support = { path = "../wafer-test-support" }
wafer-block-readonly-guard = { path = "../wafer-block-readonly-guard" }
wafer-block-ip-rate-limit = { path = "../wafer-block-ip-rate-limit" }
wafer-block-monitoring = { path = "../wafer-block-monitoring" }
wafer-block-cors = { path = "../wafer-block-cors" }
wafer-block-postgres = { path = "../wafer-block-postgres" }
wafer-block-s3 = { path = "../wafer-block-s3" }
wafer-block-router = { path = "../wafer-block-router" }
# Task 8 hostile-guest e2e (SP-A Stage 1): needs the REAL wafer-core
# database handler (decode_and_authorize / check_resource_access) wired to
# a REAL backend, not a hand-rolled fake — same shape as the
# wafer-block-postgres/s3 dev-deps above (no cycle: wafer-core does not
# depend on wafer-run).
wafer-core = { workspace = true }
wafer-block-sqlite = { path = "../wafer-block-sqlite" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serial_test = "3"

# Criterion benchmark suite (PERF-01..03 measurement prerequisite, 2026-07-14
# deep-dive review). Fixture guests are built by scripts/build-fixtures.sh.
[[bench]]
name = "wasm_guest"
harness = false
required-features = ["wasm"]

[[bench]]
name = "flow_dispatch"
harness = false
