[package]
name = "wafer-sql-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared SQL query builders for WAFER database backends"

[dependencies]
wafer-block = { path = "../wafer-block" }
wafer-schema = { workspace = true }
# Pure dialect-agnostic query builder: render SQL strings for the sqlite and
# postgres backends only. `default-features = false` drops the unused MySQL
# renderer (`backend-mysql`) and the `#[derive(Iden)]` proc-macro stack
# (`sea-query-derive` → darling), which `wafer-sql-utils` does not use — it
# implements `Iden` by hand in `ident.rs`. Keeps the wasm graph lean.
# `thread-safe` makes sea-query's shared pointers `Arc` rather than `Rc`:
# `Value::Enum` holds one, and `Statement` carries `Value`s across `.await`s
# in every `Send` database future, so without it `Statement` is not `Send`.
# `statement_tests::builder_types_are_send_and_sync` pins this.
sea-query = { version = "1.0", default-features = false, features = [
    "backend-sqlite",
    "backend-postgres",
    "with-json",
    "thread-safe",
] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }

[lints]
workspace = true
