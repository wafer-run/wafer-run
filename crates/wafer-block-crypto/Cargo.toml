[package]
name = "wafer-block-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WAFER block: cryptographic operations (hashing, JWT, random bytes)"

[dependencies]
wafer-core = { path = "../wafer-core", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
hkdf = { workspace = true }
base64ct = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
# The OS RNG behind `primitives::random_bytes`; argon2 draws its salts through
# the same major version.
getrandom = "0.4"

# Password hashing runs on a dedicated thread on native hosts (see
# src/offload.rs): tokio's executor-agnostic `Semaphore` bounds the jobs and
# a `futures` oneshot carries each result back. wasm32 does not offload.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }
futures = { workspace = true }

# getrandom needs the JS backend on wasm32-unknown-unknown (wasip1 has a
# native WASI source), as wafer-block selects it for getrandom 0.2.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wafer-block = { path = "../wafer-block" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
