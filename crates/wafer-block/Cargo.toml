[package]
name = "wafer-block"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, traits, and macros for WAFER block authors"
repository = "https://github.com/wafer-run/wafer-run"
keywords = ["wafer", "blocks", "types", "sdk"]

[features]
default = []
json-schema = ["schemars"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
wafer-flow = { workspace = true }
wafer-block-macro = { workspace = true }
schemars = { version = "1", optional = true }
futures = { workspace = true }
linkme = { workspace = true }
rmp-serde = "1.3"

# Async primitives — `tokio` channels (`sync` feature only, no `net`/`io` so
# wasm32 builds). Buffered `OutputStream` constructors (`respond`, `error`,
# `drop_request`, `continue_with`, `respond_with_meta`) pre-fill their channel
# with `try_send` — no runtime spawn required. Streaming producers use
# `OutputStream::new_streaming()` and drive the sink directly.
tokio = { version = "1", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# Platform-aware spawn for OutputStream::from_producer.
# Native: tokio/rt for tokio::spawn. WASM: wasm-bindgen-futures for spawn_local.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

# wasm-bindgen-futures is only needed for the browser (wasm32-unknown-unknown).
# wasm32-wasip1 (WASI) blocks are synchronous and must not pull in wbindgen.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
