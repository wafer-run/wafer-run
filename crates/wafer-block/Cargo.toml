[package]
name = "wafer-block"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, traits, and macros for WAFER block authors"
repository = "https://github.com/wafer-run/wafer-run"
keywords = ["wafer", "blocks", "types", "sdk"]

[features]
default = []
json-schema = ["schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
wafer-flow = { workspace = true }
wafer-block-macro = { path = "../wafer-block-macro" }
schemars = { version = "1", optional = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
