[package]
name = "wafer-block"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, traits, and macros for WAFER block authors"
repository = "https://github.com/wafer-run/wafer-run"
keywords = ["wafer", "blocks", "types", "sdk"]

[features]
default = []
json-schema = ["schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
wafer-flow = { workspace = true }
wafer-block-macro = { path = "../wafer-block-macro" }
schemars = { version = "1", optional = true }
futures = { workspace = true }

# Async primitives — `tokio` channels, CancellationToken, and ReceiverStream
# are used on both native and wasm32. We explicitly avoid tokio's `net`/`io`
# features (which pull in `mio`) so this builds for wasm32.
#
# Background tasks driving the producer side of an OutputStream are spawned
# via `tokio::spawn` on native and `wasm_bindgen_futures::spawn_local` on wasm32
# (see `streams::output::spawn_producer`).
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
