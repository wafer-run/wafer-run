[package]
name = "wafer-block-auth-validator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authentication middleware block for WAFER"

[dependencies]
wafer-block = { path = "../wafer-block" }
wafer-core = { path = "../wafer-core", default-features = false }
chrono = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
wafer-test-support = { path = "../wafer-test-support" }
wafer-run = { path = "../wafer-run" }
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json.workspace = true

[lints]
workspace = true

[lib]
name = "wafer_block_auth_validator"
path = "src/lib.rs"
