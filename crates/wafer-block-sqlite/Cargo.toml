[package]
name = "wafer-block-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite database block for WAFER"

[dependencies]
wafer-block = { workspace = true }
wafer-core = { path = "../wafer-core", default-features = false }
wafer-sql-utils = { path = "../wafer-sql-utils" }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { version = "0.1", optional = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
chrono = { workspace = true }

[features]
default = []
vectors = ["dep:sqlite-vec"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wafer-block-fastembed = { path = "../wafer-block-fastembed" }

[lints]
workspace = true

[lib]
name = "wafer_block_sqlite"
path = "src/lib.rs"
