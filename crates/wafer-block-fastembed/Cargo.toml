[package]
name = "wafer-block-fastembed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ONNX-based EmbeddingService via fastembed-rs"

[dependencies]
wafer-core = { path = "../wafer-core", default-features = false }
fastembed = "5"
# Same requirement as fastembed 5's own `tokenizers` dep: names the type of
# `TextEmbedding::tokenizer` (cloned for lock-free count_tokens). If fastembed
# ever bumps to an incompatible tokenizers, this fails loudly at compile time
# instead of silently splitting into two crate versions.
tokenizers = { version = "0.22", default-features = false }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

[lib]
name = "wafer_block_fastembed"
path = "src/lib.rs"
