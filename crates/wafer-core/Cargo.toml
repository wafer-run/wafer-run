[package]
name = "wafer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared interfaces, clients, and utilities for WAFER blocks"

[features]
default = []
# Enable the WASM Component sync path (WIT call-block imports).
# Without this feature, the native async (ctx-based) path is used even on wasm32.
# This is needed because CF Workers use wasm-bindgen (wasm32 but async), not WIT Components.
wasm-component = []

[dependencies]
wafer-schema = { workspace = true }
wafer-block = { path = "../wafer-block" }
wafer-sql-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
uuid = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Blocking-pool offload for CPU-heavy crypto ops (PERF-02); wasm32 builds
# keep the pure sync path and never link the runtime.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
async-stream = "0.3"

[lints]
workspace = true

[lib]
name = "wafer_core"
path = "src/lib.rs"
