[package]
name = "dev-fake-app"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
# Standalone workspace so it doesn't pollute the main wafer-run target dir
# or workspace feature unification.

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
