[package]
name = "wafer-block-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PostgreSQL database block for WAFER"

[dependencies]
wafer-block = { workspace = true }
wafer-schema = { workspace = true }
wafer-core = { path = "../wafer-core", default-features = false }
wafer-sql-utils = { path = "../wafer-sql-utils" }
base64ct = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# Enable the shared DatabaseService conformance suite for tests/conformance.rs.
# Same crate as the normal dependency; this dev-only entry turns on the
# `conformance` feature for this crate's own test build.
wafer-core = { path = "../wafer-core", features = ["conformance"] }

[lints]
workspace = true

[lib]
name = "wafer_block_postgres"
path = "src/lib.rs"
