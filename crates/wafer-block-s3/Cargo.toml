[package]
name = "wafer-block-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S3-compatible storage block for WAFER"

[features]
# The statically registered `wafer-run/s3` block. Off by default: linking the
# crate for `S3StorageService` alone must not add a block whose `Init` reads
# (and can refuse) its own `WAFER_RUN__S3__*` config.
block = []

[dependencies]
wafer-block = { path = "../wafer-block" }
wafer-core = { path = "../wafer-core", default-features = false }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
async-trait = { workspace = true }
wafer-block-macro = { workspace = true }
chrono = { workspace = true }
# The Init payload's config values.
serde_json = { workspace = true }

[lints]
workspace = true

[lib]
name = "wafer_block_s3"
path = "src/lib.rs"

[dev-dependencies]
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
futures = { workspace = true }
# The block's own tests (`src/block.rs`) need it compiled.
wafer-block-s3 = { path = ".", features = ["block"] }
