[package]
name = "wafer-run-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js native addon for the WAFER runtime via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
wafer-run = { path = "../wafer-run", features = ["full"] }
wafer-block = { path = "../wafer-block" }
wafer-flow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
base64ct = { workspace = true }

[lints]
workspace = true
