# Ignored advisories — these are in transitive dependencies we can't update yet.
# Review periodically and remove once the dependency chain is updated.

[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa timing side-channel — no fix available
    "RUSTSEC-2026-0002", # lru stacked borrows — pinned by aws-sdk-s3
    "RUSTSEC-2026-0098", # rustls-webpki 0.101.7 URI name constraints — pinned by AWS SDK rustls 0.21
    "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 wildcard name constraints — pinned by AWS SDK rustls 0.21
    "RUSTSEC-2026-0097", # rand — waiting for upstream fix
    "RUSTSEC-2025-0119", # number_prefix unmaintained — transitive via fastembed → hf-hub → indicatif
    "RUSTSEC-2024-0436", # paste unmaintained — transitive via fastembed → tokenizers
    "RUSTSEC-2026-0104", # rustls-webpki panic on malformed CRL — 0.101.7 pinned by aws-sdk-s3, 0.103.12 pinned by reqwest-rustls 0.26 chain; DoS-only, no code exec
]
informational_warnings = ["unmaintained"]
