# cargo-audit configuration (scripts/check.sh audit).
#
# Every ignored advisory sits on its own line, directly below a comment
# block that holds both
#   REASON:      why it cannot be fixed now, and where the crate comes from
#   REMOVE WHEN: the concrete condition that retires the ignore
# scripts/lint-workflows.sh fails CI when an entry lacks either. See
# "Security advisories" in CONTRIBUTING.md for how to handle a new one.

[advisories]
ignore = [
    # paste: unmaintained (informational, no vulnerability).
    #   REASON: proc-macro reached through fastembed -> tokenizers ->
    #   macro_rules_attribute and image -> ravif -> rav1e; nothing in the
    #   workspace can replace it.
    #   REMOVE WHEN: those crates move to a maintained alternative (e.g.
    #   pastey), i.e. paste is gone from Cargo.lock.
    "RUSTSEC-2024-0436",
    # h2: unbounded empty DATA frames.
    #   REASON: DEV/TEST ONLY. `cargo tree --locked -e normal -i h2@0.3.27`
    #   prints nothing — the vulnerable crate is in no production artifact.
    #   It is reached solely through wafer-block-s3's [dev-dependencies]
    #   `aws-sdk-s3 features = ["test-util"]` → aws-smithy-runtime/test-util
    #   → legacy-test-util → connector-hyper-0-14-x → hyper 0.14 → h2 0.3.27,
    #   inside test binaries that mock the transport and never open a socket.
    #   Our production h2 (via hyper 1.x) is 0.4.19, which IS patched.
    #   `patched = [">= 0.4.16"]`, so the 0.3.x line has no fix at all — it
    #   needs a major bump upstream. The test-util feature cannot simply be
    #   dropped either: `aws_smithy_mocks::mock_client!` expands to
    #   `with_test_defaults_v2()`, which is gated on that feature.
    #   REMOVE WHEN: smithy-rs decouples `legacy-test-util` from `test-util`.
    #   Still coupled as of aws-smithy-runtime 1.14 / aws-smithy-http-client
    #   1.4, so a plain `cargo update` will clear this once they split.
    #   NOTE: cargo-audit ignores are advisory-wide, not version-scoped, so
    #   this also silences the advisory for our 0.4.x line. A downgrade there
    #   below 0.4.16 would go unflagged — it would require an explicit
    #   lockfile change, which review should catch.
    "RUSTSEC-2026-0258",
]
informational_warnings = ["unmaintained"]
