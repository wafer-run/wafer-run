# Pull-request trigger shim. The actual jobs live in ci-jobs.yml and the
# commands they run live in scripts/check.sh.
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'sdks/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check.sh'
      - 'scripts/build-fixtures.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-jobs.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-jobs.yml
