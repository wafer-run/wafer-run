name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'sdks/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: check

      - name: Build echo_block.wasm test fixture
        run: |
          (cd examples/wasmi-block && cargo build --release --target wasm32-wasip1)
          mkdir -p crates/wafer-run/testdata
          cp examples/wasmi-block/target/wasm32-wasip1/release/wafer_example_wasmi_echo.wasm \
             crates/wafer-run/testdata/echo_block.wasm

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test-v2

      - name: Build wasm test fixtures
        run: |
          (cd examples/wasmi-block && cargo build --release --target wasm32-wasip1)
          mkdir -p crates/wafer-run/testdata
          cp examples/wasmi-block/target/wasm32-wasip1/release/wafer_example_wasmi_echo.wasm \
             crates/wafer-run/testdata/echo_block.wasm
          cargo build --release --target wasm32-wasip1 \
            --manifest-path crates/wafer-run/tests/attachment_dispatch/Cargo.toml
          cargo build --release --target wasm32-wasip1 \
            --manifest-path crates/wafer-run/tests/dispatch_guest/Cargo.toml

      - name: Run tests
        run: cargo test --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Run audit
        run: cargo audit
