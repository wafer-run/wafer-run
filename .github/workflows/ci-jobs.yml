# Shared CI jobs, called by ci.yml (pull requests) and ci-main.yml (main).
#
# The Rust commands live in scripts/check.sh — the single definition of
# "green". Each job here only does GitHub-specific setup (toolchains,
# caches) and then invokes the script's named steps.
#
# `ci-ok` at the bottom is the one job branch protection requires. It
# passes only when every other job in this file succeeded; a job that
# failed, was cancelled or was skipped turns it red. Adding a job here
# means adding its id to `ci-ok.needs` — scripts/lint-workflows.sh (the
# `workflows` job) fails the build when the two lists disagree.
name: CI Jobs

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint type-checks the workflow files (expressions, `needs`,
      # reusable-workflow calls) and shellchecks their `run:` blocks.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          rm "$tarball"

      - name: Run actionlint
        run: ./actionlint -color

      - name: Lint workflows
        run: ./scripts/lint-workflows.sh

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck scripts/*.sh .githooks/*

  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml is the single source of truth for the
      # toolchain version, components, and targets; a bare
      # `rustup toolchain install` reads it.
      - name: Install Rust
        run: rustup toolchain install

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: check

      # clippy --all-targets compiles tests that include_bytes! the
      # echo fixture, so fixtures must exist before linting.
      - name: Build wasm test fixtures
        run: ./scripts/check.sh fixtures

      - name: Check formatting
        run: ./scripts/check.sh fmt

      - name: Run clippy
        run: ./scripts/check.sh clippy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test-v2

      - name: Build wasm test fixtures
        run: ./scripts/check.sh fixtures

      - name: Run tests
        run: ./scripts/check.sh test

  postgres:
    name: PostgreSQL Conformance
    runs-on: ubuntu-latest
    # The shared DatabaseService conformance suite against a live server.
    # The test skips when WAFER_CONFORMANCE_POSTGRES_URL is unset, so the
    # check.sh step refuses to run without it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAFER_CONFORMANCE_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: postgres

      - name: PostgreSQL conformance
        run: ./scripts/check.sh postgres

  wasm:
    name: Wasm & Feature Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: wasm

      # Runs the argon2 memory-bound fixture (run_wasm in scripts/check.sh).
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Covers: guest SDK on wasm32-wasip1, wafer-run with
      # --no-default-features (wasmi off), the wafer-core wasm-component
      # guest path, the gizza consumer combo (wafer-run on
      # wasm32-unknown-unknown with --features wasmi), the wasm32 compile
      # fixtures, wafer-block-crypto on wasm32-unknown-unknown, and the
      # argon2 memory bound measured on wasm32 under node. See run_wasm in
      # scripts/check.sh.
      - name: Wasm & feature builds
        run: ./scripts/check.sh wasm

  # The embedder bindings: the C ABI (wafer-ffi), the Go SDK linked
  # against it, the Node addon (wafer-run-node) and
  # packages/wafer-client-js. See run_bindings in scripts/check.sh.
  bindings:
    name: Bindings (C ABI, Go, Node, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: bindings

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/wafer-run-go/go.mod
          cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The C ABI and Node smoke tests run a flow through the echo guest.
      - name: Build wasm test fixtures
        run: ./scripts/check.sh fixtures

      - name: Bindings
        run: ./scripts/check.sh bindings

  # audit.yml is also scheduled weekly on its own, so a new advisory
  # against an unchanged Cargo.lock is reported without waiting for a PR.
  audit:
    uses: ./.github/workflows/audit.yml

  ci-ok:
    name: ci-ok
    # always(): a failed or skipped dependency must turn this job red, not
    # skip it — a skipped required check reads as passing.
    if: always()
    # Every other job id in this file, one per line. Enforced by
    # scripts/lint-workflows.sh.
    needs:
      - workflows
      - shellcheck
      - check
      - test
      - postgres
      - wasm
      - bindings
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
