name: CI Main

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'sdks/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-main.yml'

concurrency:
  group: ci-main
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: check

      - name: Build echo_block.wasm test fixture
        run: |
          (cd examples/wasmi-block && cargo build --release --target wasm32-wasip1)
          mkdir -p crates/wafer-run/testdata
          cp examples/wasmi-block/target/wasm32-wasip1/release/wafer_example_wasmi_echo.wasm \
             crates/wafer-run/testdata/echo_block.wasm

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test

      - name: Build wasm test fixtures
        run: |
          (cd examples/wasmi-block && cargo build --release --target wasm32-wasip1)
          mkdir -p crates/wafer-run/testdata
          cp examples/wasmi-block/target/wasm32-wasip1/release/wafer_example_wasmi_echo.wasm \
             crates/wafer-run/testdata/echo_block.wasm
          cargo build --release --target wasm32-wasip1 \
            --manifest-path crates/wafer-run/tests/attachment_dispatch/Cargo.toml
          cargo build --release --target wasm32-wasip1 \
            --manifest-path crates/wafer-run/tests/dispatch_guest/Cargo.toml

      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: Wasm & Feature Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wasm

      # Guest-facing SDK must keep compiling to wasm — every compiled block
      # depends on these two crates. Today this is only proven *incidentally*
      # by the echo-fixture build (a separate workspace); assert it directly so
      # the coverage can't silently disappear if the fixtures change.
      - name: Guest SDK builds to wasm32-wasip1
        run: cargo build -p wafer-block -p wafer-sdk --target wasm32-wasip1

      # The wasmi-off code path (wafer-run without its default `wasm` feature)
      # is otherwise never compiled in CI — clippy/test run with default
      # features on. Catches `#[cfg(feature = "wasmi")]` gating regressions.
      - name: Runtime builds with --no-default-features (wasmi off)
        run: cargo check -p wafer-run --no-default-features

      # The wafer-core `wasm-component` guest path (sync typed service clients,
      # incl. the `call_service` streaming-ABI driver) is compiled by nothing
      # else in CI — default features leave it off. Lint it on the real wasm32
      # target so extern-signature drift or FFI regressions surface here.
      - name: Guest service-client path (wafer-core wasm-component → wasm32)
        run: cargo clippy -p wafer-core --features wasm-component --target wasm32-wasip1 -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Run audit
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: coverage

      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude wafer-run --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
