# Push-to-main trigger shim. The actual jobs live in ci-jobs.yml and the
# commands they run live in scripts/check.sh; this workflow additionally
# runs the coverage job, which only makes sense on main.
name: CI Main

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'sdks/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check.sh'
      - 'scripts/build-fixtures.sh'
      - '.github/workflows/ci-main.yml'
      - '.github/workflows/ci-jobs.yml'

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-jobs.yml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: coverage

      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude wafer-run --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
