# Keeps the SHA-pinned actions in .github/workflows and the root
# Cargo.lock current. scripts/lint-workflows.sh requires every action to
# be pinned by commit SHA; Dependabot updates the SHA and its `# vX.Y.Z`
# comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Root lock only. The fixture crates' own Cargo.locks are not listed:
  # scripts/fixture-locks.sh (run by `check.sh fixtures`) requires every
  # crate they share with the root lock to resolve to a root-pinned
  # version, so a separate fixture bump would fail it, and a root bump
  # fails it until `./scripts/fixture-locks.sh sync` is pushed to the
  # Dependabot PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
